# Conda environment for CMPE 258 HW1 (nanolm).
#   conda env create -f environment.yml      # create it once
#   conda activate nanolm                     # use it
# PyTorch is installed afterwards with pip (PyTorch stopped publishing conda packages in 2024):
#   pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cu124   # SJSU HPC (CentOS 7, glibc 2.17)
#   pip install torch --index-url https://download.pytorch.org/whl/cu128               # newer Linux, e.g. Ubuntu
name: nanolm
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - pyyaml
  - pandas
  - matplotlib
  - scipy
  - pytest
  - sentencepiece
  - tiktoken
